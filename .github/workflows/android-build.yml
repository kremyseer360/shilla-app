name: Build Shilla Plus Android APK
on:
  workflow_dispatch: {}
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python & Prepare Static Music Manifest
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate www/assets/music/manifest.json from MP3 files
        run: |
          python3 prepare_music.py
          echo '--- www/assets/music content ---'
          ls -la www/assets/music

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor Dependencies & Add Android Platform
        run: |
          rm -rf android
          npm install
          npx cap add android
          npx cap sync android

      - name: Generate App Icon, Adaptive Background & Splash
        run: |
          pip install pillow
          python3 scripts/android_assets.py

      - name: Inject CAMERA Permission for QR Code Scanner in AndroidManifest.xml
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q "android.permission.CAMERA" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application|' "$MANIFEST"
          fi

      - name: Build Android APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Ready APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shilla-plus-v15-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
